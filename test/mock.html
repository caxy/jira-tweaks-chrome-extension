<!doctype html>
<html><head><meta charset="utf-8"><title>Jira Tweaks mock</title>
<link rel="stylesheet" href="../content.css">
<style>
body{font-family:-apple-system,sans-serif;padding:24px;color:#172b4d}
.panel{width:460px;border:1px solid #dfe1e6;padding:16px}
.row{display:flex;gap:16px;padding:6px 0}
.row .lbl{width:120px;color:#6b778c;flex:none}
h3{font-size:12px;text-transform:uppercase;color:#6b778c;margin:20px 0 4px}
#log{margin-top:24px;white-space:pre;font:12px monospace;background:#f4f5f7;padding:8px}
.nav{margin-bottom:16px;font:13px monospace}
</style>
</head><body>
<p class="nav">
  Load as: <a href="?selectedIssue=EXT-4567">EXT-4567 &rarr; INT</a> &middot;
  <a href="?selectedIssue=EXT2-77">EXT2-77 &rarr; INT2</a> &middot;
  <a href="?selectedIssue=EXT-9999">EXT-9999 (no match)</a> &middot;
  <a href="?selectedIssue=EXT-4567&amp;fail=auth">EXT-4567 (lookup fails)</a> &middot;
  <a href="?selectedIssue=INT-100">INT-100 (unmapped)</a>
</p>
<div class="panel">
  <nav><a href="/browse/ABC-123">ABC-123</a></nav>
  <h2>Fix the widget</h2>
  <div class="row"><div class="lbl">Assignee</div><div><button>Unassigned</button></div></div>
  <div class="row"><div class="lbl">Due date</div><div id="cloud-val">Sep 17, 2026</div></div>
  <dl>
    <dt>Due Date</dt><dd id="dc-val">17/Sep/26</dd>
    <dt>Created</dt><dd>Sep 1, 2026</dd>
  </dl>
  <div class="row"><div class="lbl">Due date</div><div><button>Already editable</button></div></div>

  <h3>Details</h3>
  <div class="row"><div class="lbl">Parent</div><div class="val"><a href="/browse/EXT-4000">EXT-4000</a> Client epic</div></div>
  <div class="row"><div class="lbl">Status</div><div class="val">In Progress</div></div>
</div>
<div id="log"></div>
<script>
  const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
  const params = new URLSearchParams(location.search);

  // Stand in for chrome.storage.sync / the background service worker.
  window.jiraTweaksSettings = {
    internalSite: 'https://example.atlassian.net',
    mappings: [
      { client: 'EXT', internal: 'INT' },
      { client: 'EXT2', internal: 'INT2' }
    ],
    fieldLabel: 'Caxy ticket'
  };

  // Stands in for the service worker: resolves the mapping the same way, then
  // answers from a tiny fixture keyed by client project.
  const FIXTURES = {
    'EXT-4567': { key: 'INT-812', summary: 'EXT-4567/Rework the widget pipeline' },
    'EXT2-77': { key: 'INT2-19', summary: 'EXT2-77/Port the importer' }
  };
  window.jiraTweaksLookup = async (clientKey) => {
    const settings = window.JiraTweaks.normalize(window.jiraTweaksSettings);
    const project = window.JiraTweaks.internalFor(settings, clientKey);
    log(`lookup ${clientKey} -> ${project || '(unmapped)'}`);
    const searchUrl = window.JiraTweaks.searchUrl(settings.internalSite, project, clientKey);
    if (params.get('fail')) return { ok: false, code: 'auth', project, error: 'Not signed in (HTTP 401).', searchUrl };
    const hit = FIXTURES[clientKey];
    if (!hit) return { ok: false, code: 'notfound', project, searchUrl };
    return {
      ok: true,
      key: hit.key,
      project,
      summary: hit.summary,
      url: `https://example.atlassian.net/browse/${hit.key}`,
      searchUrl
    };
  };

  // Mock the Jira REST API used by the due-date editor and record calls.
  window.fetch = async (url, opts = {}) => {
    log(`${opts.method || 'GET'} ${url} ${opts.body || ''}`);
    if ((opts.method || 'GET') === 'GET') return new Response(JSON.stringify({ fields: { duedate: '2026-09-17' } }), { status: 200 });
    if (JSON.parse(opts.body).fields.duedate === '1999-01-01') return new Response(JSON.stringify({ errorMessages: [], errors: { duedate: 'Field cannot be set.' } }), { status: 400 });
    return new Response(null, { status: 204 });
  };
</script>
<script src="../settings.js"></script>
<script src="../content.js"></script>
</body></html>
